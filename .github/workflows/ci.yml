name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: e2e (live DHT, non-blocking)
    runs-on: ubuntu-latest
    # The e2e suite establishes real HyperDHT tunnels; DHT/holepunch can be
    # flaky on hosted CI runners, so this job reports signal without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
