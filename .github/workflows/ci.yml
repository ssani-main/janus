name: CI
#
# Third-party actions are pinned to a full 40-char commit SHA, not a version
# tag. `@v5` is MUTABLE -- the upstream author can move it to point at
# different code at any time, so approving a tag once approves whatever it
# later becomes. A SHA is immutable, so what runs here is exactly what was
# reviewed. The trailing comment records which release each SHA is, since a
# bare SHA tells a reader nothing.
#
# To bump (there is no auto-update -- that is the trade-off):
#   gh api repos/actions/<name>/commits/<tag> --jq .sha
# then update the SHA and its version comment together.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: e2e (live DHT, non-blocking)
    runs-on: ubuntu-latest
    # The e2e suite establishes real HyperDHT tunnels; DHT/holepunch can be
    # flaky on hosted CI runners, so this job reports signal without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
